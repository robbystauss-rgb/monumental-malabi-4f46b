openapi: 3.1.0
info:
  title: REC Mama Made Etsy Manager
  version: 1.1.0
  description: Private API for reading and updating the REC Mama Made Etsy shop. Listing deletion is intentionally not exposed.
servers:
  - url: https://recmamamade.netlify.app/.netlify/functions
security:
  - bearerAuth: []
paths:
  /etsy-status:
    get:
      operationId: getEtsyConnectionStatus
      summary: Check Etsy connection and shop identity
      description: Use this first to verify the private Etsy connector is authorized and to identify the connected shop.
      responses:
        '200':
          description: Connection status and shop information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionStatus'
  /etsy-listings:
    get:
      operationId: listEtsyListings
      summary: List Etsy listings by state
      description: Read listings for the connected REC Mama Made shop. Use before editing so the correct listing_id and current listing data are known.
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [active, inactive, sold_out, draft, expired]
            default: active
          description: Etsy listing state to retrieve.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Etsy listings and shop information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingsResponse'
  /etsy-listing-update:
    post:
      operationId: updateEtsyListing
      summary: Update an existing Etsy listing
      description: Changes listing fields. Always read the listing first. Setting state to active publishes or reactivates the listing and should only be done after the user explicitly asks to publish.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id]
              properties:
                listing_id:
                  type: integer
                  minimum: 1
                title:
                  type: string
                description:
                  type: string
                tags:
                  type: array
                  maxItems: 13
                  items:
                    type: string
                state:
                  type: string
                  enum: [active, inactive]
                price:
                  type: number
                  minimum: 0
                quantity:
                  type: integer
                  minimum: 0
                should_auto_renew:
                  type: boolean
                is_personalizable:
                  type: boolean
                is_customizable:
                  type: boolean
                is_taxable:
                  type: boolean
                shop_section_id:
                  type: integer
                  minimum: 1
                type:
                  type: string
                  enum: [physical, download, both]
      responses:
        '200':
          description: Updated Etsy listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
  /etsy-personalization-update:
    post:
      operationId: updateEtsyListingPersonalization
      summary: Create or replace listing personalization questions
      description: Replaces the listing's personalization question configuration using Etsy's current personalization API. Read the listing first and only change personalization when requested.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id, personalization_questions]
              properties:
                listing_id:
                  type: integer
                  minimum: 1
                personalization_questions:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: object
                    required: [question_text, question_type, required]
                    properties:
                      question_id:
                        type: integer
                        minimum: 1
                      question_text:
                        type: string
                      instructions:
                        type: string
                        maxLength: 120
                      question_type:
                        type: string
                        enum: [text_input, dropdown]
                      required:
                        type: boolean
                      max_allowed_characters:
                        type: integer
                        minimum: 1
                        maximum: 1024
                      options:
                        type: array
                        items:
                          type: object
                          required: [label]
                          properties:
                            option_id:
                              type: integer
                              minimum: 1
                            label:
                              type: string
      responses:
        '200':
          description: Updated personalization configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalizationResponse'
  /etsy-shop-update:
    post:
      operationId: updateEtsyShop
      summary: Update REC Mama Made shop information
      description: Changes shop-facing text such as title or announcement. Only perform the fields the user explicitly approves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                announcement:
                  type: string
                sale_message:
                  type: string
                digital_sale_message:
                  type: string
      responses:
        '200':
          description: Updated shop information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopResponse'
  /etsy-listing-image-from-url:
    post:
      operationId: uploadEtsyListingImageFromUrl
      summary: Upload a public HTTPS image to an Etsy listing
      description: Downloads a public HTTPS image and uploads it to an existing Etsy listing. This changes the listing's customer-facing media and should only be used after the user approves the image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id, image_url]
              properties:
                listing_id:
                  type: integer
                  minimum: 1
                image_url:
                  type: string
                  format: uri
                rank:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 1
                overwrite:
                  type: boolean
                  default: false
                alt_text:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Uploaded Etsy listing image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
components:
  schemas:
    ConnectionStatus:
      type: object
      properties:
        connected:
          type: boolean
        user_id:
          type: integer
        shop_id:
          type: integer
        shop_name:
          type: string
        title:
          type: string
        announcement:
          type: string
        token_expires_at:
          type: integer
      additionalProperties: true
    ListingSummary:
      type: object
      properties:
        listing_id:
          type: integer
        title:
          type: string
        description:
          type: string
        state:
          type: string
        url:
          type: string
        quantity:
          type: integer
        tags:
          type: array
          items:
            type: string
        price:
          type: object
          properties:
            amount:
              type: integer
            divisor:
              type: integer
            currency_code:
              type: string
          additionalProperties: true
      additionalProperties: true
    ListingsResponse:
      type: object
      properties:
        shop_id:
          type: integer
        shop_name:
          type: string
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ListingSummary'
      additionalProperties: true
    ListingResponse:
      type: object
      properties:
        listing_id:
          type: integer
        title:
          type: string
        description:
          type: string
        state:
          type: string
        url:
          type: string
        quantity:
          type: integer
        tags:
          type: array
          items:
            type: string
      additionalProperties: true
    PersonalizationQuestion:
      type: object
      properties:
        question_id:
          type: integer
        question_text:
          type: string
        instructions:
          type: string
        question_type:
          type: string
        required:
          type: boolean
        max_allowed_characters:
          type: integer
        options:
          type: array
          items:
            type: object
            properties:
              option_id:
                type: integer
              label:
                type: string
      additionalProperties: true
    PersonalizationResponse:
      type: object
      properties:
        listing_id:
          type: integer
        personalization_questions:
          type: array
          items:
            $ref: '#/components/schemas/PersonalizationQuestion'
      additionalProperties: true
    ShopResponse:
      type: object
      properties:
        shop_id:
          type: integer
        shop_name:
          type: string
        title:
          type: string
        announcement:
          type: string
        sale_message:
          type: string
        digital_sale_message:
          type: string
      additionalProperties: true
    ImageResponse:
      type: object
      properties:
        listing_image_id:
          type: integer
        listing_id:
          type: integer
        rank:
          type: integer
        alt_text:
          type: string
        url_fullxfull:
          type: string
      additionalProperties: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
