openapi: 3.1.0
info:
  title: REC Mama Made Etsy Manager
  version: 1.2.0
  description: Private API for reading and updating the REC Mama Made Etsy shop. Listing deletion is intentionally not exposed.
servers:
  - url: https://recmamamade.netlify.app/.netlify/functions
security:
  - bearerAuth: []
paths:
  /etsy-status:
    get:
      operationId: getEtsyConnectionStatus
      summary: Check Etsy connection and shop identity
      responses:
        '200':
          description: Connection status and shop information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionStatus'
  /hat-options:
    get:
      operationId: getHatVariationCatalog
      summary: Get REC Mama Made hat models and verified Drive color options
      description: Use this as the source of truth for Richardson hat model/color combinations. Do not invent colors or assign a color to the wrong model.
      responses:
        '200':
          description: Verified hat catalog sourced from REC Mama Made Google Drive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HatCatalog'
  /etsy-listings:
    get:
      operationId: listEtsyListings
      summary: List Etsy listings by state
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [active, inactive, sold_out, draft, expired]
            default: active
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Etsy listings and shop information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingsResponse'
  /etsy-listing-inventory:
    get:
      operationId: getEtsyListingInventory
      summary: Read listing variation inventory
      description: Use before any variation update. Returns products, offerings, and property values for a listing.
      parameters:
        - in: query
          name: listing_id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Etsy listing inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
  /etsy-listing-inventory-update:
    post:
      operationId: updateEtsyListingInventory
      summary: Replace listing variation inventory
      description: High-impact write. Read current inventory first and only call after explicit approval. The request must contain the full desired product set because Etsy inventory updates replace the inventory definition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id, products]
              properties:
                listing_id:
                  type: integer
                  minimum: 1
                max_variations_supported:
                  type: integer
                  enum: [2, 3]
                  default: 2
                products:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/InventoryProductWrite'
                price_on_property:
                  type: array
                  items:
                    type: integer
                quantity_on_property:
                  type: array
                  items:
                    type: integer
                sku_on_property:
                  type: array
                  items:
                    type: integer
                readiness_state_on_property:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Updated Etsy listing inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
  /etsy-listing-update:
    post:
      operationId: updateEtsyListing
      summary: Update an existing Etsy listing
      description: Changes listing fields. Always read the listing first. Setting state to active publishes or reactivates the listing and should only be done after the user explicitly asks to publish.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id]
              properties:
                listing_id:
                  type: integer
                  minimum: 1
                title:
                  type: string
                description:
                  type: string
                tags:
                  type: array
                  maxItems: 13
                  items:
                    type: string
                state:
                  type: string
                  enum: [active, inactive]
                price:
                  type: number
                  minimum: 0
                quantity:
                  type: integer
                  minimum: 0
                should_auto_renew:
                  type: boolean
                is_personalizable:
                  type: boolean
                is_customizable:
                  type: boolean
                is_taxable:
                  type: boolean
                shop_section_id:
                  type: integer
                  minimum: 1
                type:
                  type: string
                  enum: [physical, download, both]
      responses:
        '200':
          description: Updated Etsy listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
  /etsy-personalization-update:
    post:
      operationId: updateEtsyListingPersonalization
      summary: Create or replace listing personalization questions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id, personalization_questions]
              properties:
                listing_id:
                  type: integer
                  minimum: 1
                personalization_questions:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: object
                    required: [question_text, question_type, required]
                    properties:
                      question_id:
                        type: integer
                        minimum: 1
                      question_text:
                        type: string
                      instructions:
                        type: string
                        maxLength: 120
                      question_type:
                        type: string
                        enum: [text_input, dropdown]
                      required:
                        type: boolean
                      max_allowed_characters:
                        type: integer
                        minimum: 1
                        maximum: 1024
                      options:
                        type: array
                        items:
                          type: object
                          required: [label]
                          properties:
                            option_id:
                              type: integer
                              minimum: 1
                            label:
                              type: string
      responses:
        '200':
          description: Updated personalization configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalizationResponse'
  /etsy-shop-update:
    post:
      operationId: updateEtsyShop
      summary: Update REC Mama Made shop information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                announcement:
                  type: string
                sale_message:
                  type: string
                digital_sale_message:
                  type: string
      responses:
        '200':
          description: Updated shop information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopResponse'
  /etsy-listing-image-from-url:
    post:
      operationId: uploadEtsyListingImageFromUrl
      summary: Upload a public HTTPS image to an Etsy listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id, image_url]
              properties:
                listing_id:
                  type: integer
                  minimum: 1
                image_url:
                  type: string
                  format: uri
                rank:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 1
                overwrite:
                  type: boolean
                  default: false
                alt_text:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Uploaded Etsy listing image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
components:
  schemas:
    ConnectionStatus:
      type: object
      properties:
        connected:
          type: boolean
        user_id:
          type: integer
        shop_id:
          type: integer
        shop_name:
          type: string
        title:
          type: string
        announcement:
          type: string
        token_expires_at:
          type: integer
      additionalProperties: true
    HatModel:
      type: object
      properties:
        label:
          type: string
        options:
          type: array
          items:
            type: string
        source_file:
          type: string
        source_pattern:
          type: string
      additionalProperties: true
    HatCatalog:
      type: object
      properties:
        source:
          type: string
        source_folder_id:
          type: string
        models:
          type: object
          properties:
            Richardson 112:
              $ref: '#/components/schemas/HatModel'
            Richardson 168:
              $ref: '#/components/schemas/HatModel'
            Richardson 256:
              $ref: '#/components/schemas/HatModel'
            Richardson 112PFP:
              $ref: '#/components/schemas/HatModel'
        recommendation:
          type: string
      additionalProperties: true
    ListingSummary:
      type: object
      properties:
        listing_id:
          type: integer
        title:
          type: string
        description:
          type: string
        state:
          type: string
        url:
          type: string
        quantity:
          type: integer
        tags:
          type: array
          items:
            type: string
        price:
          type: object
          properties:
            amount:
              type: integer
            divisor:
              type: integer
            currency_code:
              type: string
          additionalProperties: true
      additionalProperties: true
    ListingsResponse:
      type: object
      properties:
        shop_id:
          type: integer
        shop_name:
          type: string
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ListingSummary'
      additionalProperties: true
    InventoryMoney:
      type: object
      properties:
        amount:
          type: integer
        divisor:
          type: integer
        currency_code:
          type: string
      additionalProperties: true
    InventoryOffering:
      type: object
      properties:
        offering_id:
          type: integer
        quantity:
          type: integer
        is_enabled:
          type: boolean
        is_deleted:
          type: boolean
        price:
          oneOf:
            - type: number
            - $ref: '#/components/schemas/InventoryMoney'
        readiness_state_id:
          type: integer
      additionalProperties: true
    InventoryOfferingWrite:
      type: object
      required: [quantity, is_enabled, price]
      properties:
        quantity:
          type: integer
          minimum: 0
        is_enabled:
          type: boolean
        price:
          type: number
          minimum: 0
        readiness_state_id:
          type: integer
      additionalProperties: false
    InventoryPropertyValue:
      type: object
      properties:
        property_id:
          type: integer
        property_name:
          type: string
        scale_id:
          type: integer
        scale_name:
          type: string
        value_ids:
          type: array
          items:
            type: integer
        values:
          type: array
          items:
            type: string
      additionalProperties: true
    InventoryPropertyValueWrite:
      type: object
      required: [property_id, property_name, value_ids, values]
      properties:
        property_id:
          type: integer
        property_name:
          type: string
        scale_id:
          type: integer
        value_ids:
          type: array
          items:
            type: integer
        values:
          type: array
          items:
            type: string
      additionalProperties: false
    InventoryProduct:
      type: object
      properties:
        product_id:
          type: integer
        sku:
          type: string
        is_deleted:
          type: boolean
        offerings:
          type: array
          items:
            $ref: '#/components/schemas/InventoryOffering'
        property_values:
          type: array
          items:
            $ref: '#/components/schemas/InventoryPropertyValue'
      additionalProperties: true
    InventoryProductWrite:
      type: object
      required: [offerings, property_values]
      properties:
        sku:
          type: string
        offerings:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InventoryOfferingWrite'
        property_values:
          type: array
          items:
            $ref: '#/components/schemas/InventoryPropertyValueWrite'
      additionalProperties: false
    InventoryResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/InventoryProduct'
        price_on_property:
          type: array
          items:
            type: integer
        quantity_on_property:
          type: array
          items:
            type: integer
        sku_on_property:
          type: array
          items:
            type: integer
        readiness_state_on_property:
          type: array
          items:
            type: integer
      additionalProperties: true
    ListingResponse:
      type: object
      properties:
        listing_id:
          type: integer
        title:
          type: string
        description:
          type: string
        state:
          type: string
        url:
          type: string
        quantity:
          type: integer
        tags:
          type: array
          items:
            type: string
      additionalProperties: true
    PersonalizationQuestion:
      type: object
      properties:
        question_id:
          type: integer
        question_text:
          type: string
        instructions:
          type: string
        question_type:
          type: string
        required:
          type: boolean
        max_allowed_characters:
          type: integer
        options:
          type: array
          items:
            type: object
            properties:
              option_id:
                type: integer
              label:
                type: string
      additionalProperties: true
    PersonalizationResponse:
      type: object
      properties:
        listing_id:
          type: integer
        personalization_questions:
          type: array
          items:
            $ref: '#/components/schemas/PersonalizationQuestion'
      additionalProperties: true
    ShopResponse:
      type: object
      properties:
        shop_id:
          type: integer
        shop_name:
          type: string
        title:
          type: string
        announcement:
          type: string
        sale_message:
          type: string
        digital_sale_message:
          type: string
      additionalProperties: true
    ImageResponse:
      type: object
      properties:
        listing_image_id:
          type: integer
        listing_id:
          type: integer
        rank:
          type: integer
        alt_text:
          type: string
        url_fullxfull:
          type: string
      additionalProperties: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
